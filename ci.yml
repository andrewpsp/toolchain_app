+name: CI/CD Pipeline
+
+on:
+  push:
+    branches: [ main, master ] # Adjust to your default branch(es)
+  pull_request:
+    branches: [ main, master ]
+
+env:
+  # Define common environment variables here, similar to Jenkins 'environment' block
+  JAVA_VERSION: '11' # Example: Set your project's Java version
+  # MAVEN_VERSION: '3.8.6' # Optional: if you need a specific Maven version
+  # SONAR_PROJECT_KEY: "your_project_key_from_sonarqube" # Example
+
+jobs:
+  build_and_unit_test:
+    name: Build and Unit Test
+    runs-on: ubuntu-latest # Corresponds to Jenkins agent { label 'Node01' }
+
+    steps:
+      - name: Checkout Git repository
+        uses: actions/checkout@v4
+
+      - name: Set up JDK ${{ env.JAVA_VERSION }}
+        uses: actions/setup-java@v4
+        with:
+          java-version: ${{ env.JAVA_VERSION }}
+          distribution: 'temurin' # Or 'adopt', 'zulu', etc.
+          cache: 'maven' # Caches Maven dependencies
+
+      # Optional: Setup specific Maven version if needed.
+      # Otherwise, the version bundled with the runner or setup-java will be used.
+      # - name: Set up Maven
+      #   uses: stCarolas/setup-maven@v4.5 # A community action for Maven setup
+      #   with:
+      #     maven-version: ${{ env.MAVEN_VERSION }}
+
+      - name: Build with Maven
+        # The -B flag is for batch mode, recommended for CI
+        # Note: -Dmaven.test.failure.ignore is carried over from your Jenkinsfile.
+        # Consider removing it if you want the build to fail on test failures.
+        run: mvn -B -Dmaven.test.failure.ignore clean package
+
+      - name: Publish Unit Test Results (Surefire reports)
+        uses: actions/upload-artifact@v4
+        if: always() # Uploads reports even if the build step has test failures (due to -Dmaven.test.failure.ignore)
+        with:
+          name: surefire-reports
+          path: '**/target/surefire-reports/TEST-*.xml'
+
+      - name: Archive JAR artifact
+        uses: actions/upload-artifact@v4
+        with:
+          name: application-jar
+          path: target/*.jar # Adjust if your JAR name/path is different
+
+  automation_tests:
+    name: Automation Tests
+    runs-on: ubuntu-latest # Or a specific runner if UI tests need a display server
+    needs: build_and_unit_test # This job runs after build_and_unit_test completes
+    strategy:
+      matrix:
+        browser: [firefox, chrome]
+      fail-fast: false # Allows other matrix jobs to continue if one fails
+
+    steps:
+      - name: Checkout Git repository
+        uses: actions/checkout@v4
+
+      # If your automation tests need the built JAR:
+      # - name: Download application JAR
+      #   uses: actions/download-artifact@v4
+      #   with:
+      #     name: application-jar
+      #     path: target/
+
+      - name: Run Automated Tests on ${{ matrix.browser }}
+        run: |
+          echo "Setting up environment for ${{ matrix.browser }}..."
+          # Add steps to install browsers if not available on the runner
+          # For example, for Firefox on Ubuntu:
+          # if [ "${{ matrix.browser }}" == "firefox" ]; then
+          #   sudo apt-get update && sudo apt-get install -y firefox
+          # fi
+          echo "Automation Testing using ${{ matrix.browser }} browser..."
+          # Add your actual test execution commands here
+
+  code_analysis:
+    name: SonarQube Analysis
+    runs-on: ubuntu-latest
+    needs: build_and_unit_test
+
+    steps:
+      - name: Checkout Git repository (full depth for SonarQube)
+        uses: actions/checkout@v4
+        with:
+          fetch-depth: 0 # SonarQube needs full history
+
+      - name: Set up JDK ${{ env.JAVA_VERSION }} for SonarQube
+        uses: actions/setup-java@v4
+        with:
+          java-version: ${{ env.JAVA_VERSION }}
+          distribution: 'temurin'
+
+      # Download build artifacts if Sonar analysis depends on them (e.g., JaCoCo reports, class files)
+      # - name: Download Surefire reports
+      #   uses: actions/download-artifact@v4
+      #   with:
+      #     name: surefire-reports
+      #     path: target/surefire-reports
+
+      - name: SonarQube Scan
+        uses: sonarsource/sonarqube-scan-action@master # Use a specific version in production
+        env:
+          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }} # Store in GitHub Secrets
+          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }} # Store in GitHub Secrets
+        # with:
+          # args: >
+          #   -Dsonar.projectKey=${{ env.SONAR_PROJECT_KEY }}
+          #   -Dsonar.sources=.
+          #   -Dsonar.java.binaries=target/classes # Adjust as necessary
+          #   -Dsonar.junit.reportsPath=target/surefire-reports
+          #   # If you generate JaCoCo reports for coverage:
+          #   # -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
+
+      # The sonarqube-scan-action can often be configured to wait for the Quality Gate.
