+
+  publish_to_artifactory:
+    name: Publish to Artifactory
+    runs-on: ubuntu-latest
+    needs: code_analysis # Or build_and_unit_test, depending on your flow
+    # if: github.ref == 'refs/heads/main' # Example: only publish from the main branch
+
+    steps:
+      - name: Checkout Git repository
+        uses: actions/checkout@v4
+
+      - name: Set up JDK ${{ env.JAVA_VERSION }}
+        uses: actions/setup-java@v4
+        with:
+          java-version: ${{ env.JAVA_VERSION }}
+          distribution: 'temurin'
+          cache: 'maven'
+
+      - name: Download application JAR
+        uses: actions/download-artifact@v4
+        with:
+          name: application-jar
+          path: target/
+
+      - name: Set up JFrog CLI
+        uses: jfrog/setup-jfrog-cli@v3 # Use latest or specific version
+        env:
+          # Configure JFrog CLI with credentials from GitHub Secrets
+          JFROG_CLI_SERVER_ID_DEFAULT: "your-artifactory-server-id" # Define your Artifactory server ID
+          JFROG_CLI_URL: ${{ secrets.ARTIFACTORY_URL }} # e.g., https://yourcompany.jfrog.io/artifactory
+          JFROG_CLI_USER: ${{ secrets.ARTIFACTORY_USER }}
+          JFROG_CLI_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
+          # Alternatively, use an access token:
+          # JFROG_CLI_ACCESS_TOKEN: ${{ secrets.ARTIFACTORY_ACCESS_TOKEN }}
+
+      - name: Publish Artifacts and Build Info to Artifactory
+        run: |
+          echo "Configuring JFrog CLI for Maven deployment..."
+          # This step configures Maven to resolve/deploy from Artifactory using JFrog CLI
+          # Replace repo names and server ID with your Artifactory setup
+          # jf mvn-config --repo-deploy-releases libs-release-local --repo-deploy-snapshots libs-snapshot-local --server-id-deploy your-artifactory-server-id
+          # jf mvn-config --repo-resolve-releases libs-release --repo-resolve-snapshots libs-snapshot --server-id-resolve your-artifactory-server-id
+
+          echo "Deploying to Artifactory using Maven..."
+          # Assuming your pom.xml has <distributionManagement> configured for Artifactory
+          # The Jenkinsfile ran 'clean install'. Here, we assume the JAR is already built and downloaded.
+          # If you want Maven to handle the deployment of the pre-built JAR:
+          # mvn deploy:deploy-file -Durl=${{ secrets.ARTIFACTORY_URL }}/libs-release-local \
+          #                        -DrepositoryId=your-artifactory-server-id \
+          #                        -Dfile=target/your-artifact-name.jar \
+          #                        -DpomFile=pom.xml \
+          #                        -Dpackaging=jar \
+          #                        -DgeneratePom=false \
+          #                        -Dmaven.test.skip=true
+
+          # Or, using JFrog CLI to upload the artifact and publish build info:
+          APP_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
+          ARTIFACT_FILE_NAME=$(ls target/*.jar | head -n 1) # Gets the first JAR in target/
+
+          jf rt u --build-name="${{ github.repository }}" --build-number="${{ github.run_id }}" \
+            "${ARTIFACT_FILE_NAME}" "libs-release-local/" \
+            --target-props="status=released;version=${APP_VERSION}"
+
+          jf rt bp "${{ github.repository }}" "${{ github.run_id }}"
+        working-directory: ./ # Ensure mvn commands run from the project root
+
+  security_scan:
